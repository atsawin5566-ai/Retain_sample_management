<!DOCTYPE html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Stock Pro V3</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.hdr{background:#fff;padding:12px;border-bottom:3px solid #5b4df5}.wrap{padding:15px}.card{background:#fff;padding:12px;margin:10px 0;border-radius:8px}input,button{padding:8px;margin:4px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#5b4df5;color:#fff}.hidden{display:none}</style></head><body><div class='hdr'><h2>🟣 Solstice Technologies (Thailand) Co., Ltd.</h2><div>Stock Location & Shelf Life Management System V3</div></div><div class='wrap'><div id='login'><div class='card'><h3>Login</h3><input id='u' placeholder='Username'><input id='p' type='password' placeholder='Password'><button onclick='login()'>Login</button><p>admin/admin123 | supervisor/sup123 | user/user123</p></div></div><div id='app' class='hidden'><div class='card'><span id='who'></span> <button onclick='logout()'>Logout</button> <button onclick='backup()'>Backup</button></div><div class='card'><b>Normal:</b> <span id='n'>0</span> | <b>Near Expiry:</b> <span id='w'>0</span> | <b>Expired:</b> <span id='e'>0</span><div id='alerts'></div></div><div class='card'><h3>สินค้า</h3><input id='pn' placeholder='PN'><input id='lot' placeholder='Lot'><input id='dt' type='date'><input id='qty' type='number' placeholder='Qty'><input id='loc' placeholder='Location'><button id='save' onclick='addRow()'>บันทึก</button><button id='upd' style='display:none' onclick='updateRow()'>อัปเดต</button></div><div class='card'><input id='search'><button onclick='doSearch()'>ค้นหา</button><button onclick='render()'>ทั้งหมด</button><table><thead><tr><th>PN</th><th>Lot</th><th>Qty</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody id='tb'></tbody></table></div><div class='card'><h3>เบิก/คืน</h3><input id='bpn' placeholder='PN'><input id='blot' placeholder='Lot'><input id='bqty' type='number' placeholder='Qty'><input id='bname' placeholder='ผู้เบิก'><button onclick='borrow()'>เบิก</button><button onclick='window.print()'>พิมพ์</button><table><thead><tr><th>ID</th><th>PN</th><th>Qty</th><th>ผู้เบิก</th><th>Status</th><th></th></tr></thead><tbody id='bt'></tbody></table></div></div></div><script>const users=[{username:'admin',password:'admin123',role:'Admin'},{username:'supervisor',password:'sup123',role:'Supervisor'},{username:'user',password:'user123',role:'User'}];let edit=-1;const me=()=>JSON.parse(sessionStorage.getItem('user'));const inv=()=>JSON.parse(localStorage.getItem('inventory')||'[]');const setInv=v=>localStorage.setItem('inventory',JSON.stringify(v));const bor=()=>JSON.parse(localStorage.getItem('borrows')||'[]');const setBor=v=>localStorage.setItem('borrows',JSON.stringify(v));function login(){let x=users.find(a=>a.username==u.value&&a.password==p.value);if(x){sessionStorage.setItem('user',JSON.stringify(x));location.reload()}else alert('Login fail')}function logout(){sessionStorage.clear();location.reload()}function addRow(){if(me().role==='User')return alert('No permission');let d=inv();d.push({pn:pn.value,lot:lot.value,date:dt.value,qty:+qty.value,loc:loc.value});setInv(d);render()}function editRow(i){if(me().role!=='Admin')return;let r=inv()[i];pn.value=r.pn;lot.value=r.lot;dt.value=r.date;qty.value=r.qty;loc.value=r.loc;edit=i;save.style.display='none';upd.style.display='inline'}function updateRow(){let d=inv();d[edit]={pn:pn.value,lot:lot.value,date:dt.value,qty:+qty.value,loc:loc.value};setInv(d);edit=-1;save.style.display='inline';upd.style.display='none';render()}function delRow(i){if(me().role!=='Admin')return;let d=inv();d.splice(i,1);setInv(d);render()}function status(r){let age=Math.floor((Date.now()-new Date(r.date))/86400000);if(age>=365)return'❌Expired';if(age>=335)return'⚠️Near Expiry';return'✅Normal'}function render(list){list=list||inv();tb.innerHTML='';let a='',n1=0,w1=0,e1=0;list.forEach((r,i)=>{let s=status(r);if(s.includes('Near'))w1++;else if(s.includes('Expired'))e1++;else n1++;tb.innerHTML+=`<tr><td>${r.pn}</td><td>${r.lot}</td><td>${r.qty}</td><td>${r.loc}</td><td>${s}</td><td>${me().role==='Admin'?'<button onclick="editRow('+i+')">Edit</button><button onclick="delRow('+i+')">Delete</button>':''}</td></tr>`});n.innerText=n1;w.innerText=w1;e.innerText=e1;alerts.innerHTML=a;renderBor()}function doSearch(){let k=search.value.toLowerCase();render(inv().filter(x=>x.pn.toLowerCase().includes(k)||x.lot.toLowerCase().includes(k)))}function borrow(){let d=inv();let f=d.find(x=>x.pn===bpn.value&&x.lot===blot.value);if(!f)return alert('Not found');let q=+bqty.value;if(q>f.qty)return alert('Qty not enough');f.qty-=q;setInv(d);let b=bor();b.push({id:'BR-'+Date.now(),pn:f.pn,lot:f.lot,qty:q,name:bname.value,status:'Borrowed'});setBor(b);render()}function ret(id){let b=bor(),d=inv();let r=b.find(x=>x.id===id);if(!r||r.status==='Returned')return;let f=d.find(x=>x.pn===r.pn&&x.lot===r.lot);if(f)f.qty+=r.qty;r.status='Returned';setInv(d);setBor(b);render()}function renderBor(){bt.innerHTML='';bor().forEach(r=>bt.innerHTML+=`<tr><td>${r.id}</td><td>${r.pn}</td><td>${r.qty}</td><td>${r.name}</td><td>${r.status}</td><td>${r.status==='Borrowed'?'<button onclick="ret(\''+r.id+'\')">คืน</button>':'✔'}</td></tr>`)}function backup(){let blob=new Blob([JSON.stringify({inventory:inv(),borrows:bor()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click()}window.onload=()=>{if(me()){login.classList.add('hidden');app.classList.remove('hidden');who.innerText='User: '+me().username+' ('+me().role+')';render()}}</script></body></html>
