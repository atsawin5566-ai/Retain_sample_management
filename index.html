<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock Pro V3.1</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}

.header{
    background:#ffffff;
    border-bottom:4px solid #5b4df5;
    padding:15px 20px;
}

.header h1{
    margin:0;
    color:#333;
}

.container{
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#5b4df5;
    color:white;
}

.hidden{
    display:none;
}

.dashboard{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.box{
    background:#ffffff;
    padding:15px;
    border-radius:10px;
    min-width:180px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.normal{
    border-left:5px solid green;
}

.warning{
    border-left:5px solid orange;
}

.expired{
    border-left:5px solid red;
}

</style>

</head>

<body>

<header class="header">

<h1>
    Solstice Technologies (Thailand) Co., Ltd.
</h1>

<p>
    Stock Location & Shelf Life Management System V3.1
</p>

</header>

<div class="container">

<!-- LOGIN -->

<div id="loginSection">

    <div class="card">

        <h2>Login</h2>

        <input
            id="username"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <hr>

        <p>
            Admin : admin / admin123
        </p>

        <p>
            Supervisor : supervisor / sup123
        </p>

        <p>
            User : user / user123
        </p>

    </div>

</div>

<!-- MAIN -->

<div
id="mainSection"
class="hidden"
>

<div class="card">

    <span id="currentUser"></span>

    <button onclick="logout()">
        Logout
    </button>

</div>

<div class="dashboard">

    <div class="box normal">

        <h3>Normal</h3>

        <h1 id="normalCount">
            0
        </h1>

    </div>

    <div class="box warning">

        <h3>Near Expiry</h3>

        <h1 id="warningCount">
            0
        </h1>

    </div>

    <div class="box expired">

        <h3>Expired</h3>

        <h1 id="expiredCount">
            0
        </h1>

    </div>

</div>

<div id="alertArea"></div>

<div class="card">

    <h3>เพิ่มสินค้า</h3>

    <input id="pn" placeholder="PN">

    <input id="lot" placeholder="Lot No">

    <input id="storeDate" type="date">

    <input id="qty" type="number" placeholder="Qty">

    <input id="location" placeholder="Location">

    <button
        id="saveBtn"
        onclick="saveItem()"
    >
        บันทึก
    </button>

</div>

<div class="card">

    <input
        id="search"
        placeholder="ค้นหา PN หรือ Lot"
    >

    <button onclick="searchItem()">
        ค้นหา
    </button>

    <button onclick="displayData()">
        แสดงทั้งหมด
    </button>

</div>

<div class="card">

<table>

<thead>

<tr>
<th>PN</th>
<th>Lot</th>
<th>Date</th>
<th>Qty</th>
<th>Location</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

<script>

/* USER */

const users = [

{
    username:"admin",
    password:"admin123",
    role:"Admin"
},

{
    username:"supervisor",
    password:"sup123",
    role:"Supervisor"
},

{
    username:"user",
    password:"user123",
    role:"User"
}

];

/* LOGIN */

function login(){

    const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim();

    const password =
        document
        .getElementById(
            "password"
        )
        .value
        .trim();

    const user =
        users.find(x =>

            x.username === username &&
            x.password === password

        );

    if(!user){

        alert(
            "Username หรือ Password ไม่ถูกต้อง"
        );

        return;
    }

    localStorage.setItem(
        "currentUser",
        JSON.stringify(user)
    );

    showMain();

}

function logout(){

    localStorage.removeItem(
        "currentUser"
    );

    location.reload();

}

function showMain(){

    const user =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );

    if(!user){
        return;
    }

    document
        .getElementById(
            "loginSection"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "mainSection"
        )
        .classList
        .remove("hidden");

    document
        .getElementById(
            "currentUser"
        )
        .innerText =
        `${user.username}
         (${user.role})`;

    displayData();

}

/* STOCK */

function getStock(){

    return JSON.parse(

        localStorage.getItem(
            "stockData"
        )

    ) || [];

}

function saveItem() {

    const pn =
        document.getElementById("pn").value.trim();

    const lot =
        document.getElementById("lot").value.trim();

    const date =
        document.getElementById("storeDate").value;

    const qty =
        document.getElementById("qty").value;

    const location =
        document.getElementById("location").value.trim();

    if (!pn || !lot || !date || !qty || !location) {

        alert("กรุณากรอกข้อมูลให้ครบ");

        return;
    }

    const data = getStock();

    const duplicateLot = data.find(item =>

        item.lot &&
        item.lot.trim().toLowerCase() ===
        lot.toLowerCase()

    );

    if (duplicateLot) {

        alert(
            "❌ Lot No นี้มีอยู่ในระบบแล้ว\n\n" +
            "PN : " + duplicateLot.pn +
            "\nLocation : " + duplicateLot.location
        );

        return;
    }

    data.push({

        pn: pn,
        lot: lot,
        date: date,
        qty: qty,
        location: location

    });

    localStorage.setItem(
        "stockData",
        JSON.stringify(data)
    );

    clearForm();

    displayData();

    alert("✅ บันทึกสำเร็จ");
}

function displayData(dataList=null){

    const data =
        dataList || getStock();

    const body =
        document.getElementById(
            "tableBody"
        );

    body.innerHTML = "";

    let normal=0;
    let warning=0;
    let expired=0;

    data.forEach(item=>{

        let age = 0;

        if(item.date){

            age = Math.floor(

                (new Date()
                -
                new Date(item.date))

                /

                (1000*60*60*24)

            );

        }

        let status="✅";

        if(age>=365){

            status="❌ Expired";

            expired++;

        }else if(age>=335){

            status="⚠️ Near Expiry";

            warning++;

        }else{

            normal++;

        }

        body.innerHTML += `

        <tr>

        <td>${item.pn}</td>

        <td>${item.lot}</td>

        <td>${item.date}</td>

        <td>${item.qty}</td>

        <td>${item.location}</td>

        <td>${status}</td>

        </tr>

        `;

    });

    document
    .getElementById(
        "normalCount"
    )
    .innerText = normal;

    document
    .getElementById(
        "warningCount"
    )
    .innerText = warning;

    document
    .getElementById(
        "expiredCount"
    )
    .innerText = expired;

}

function searchItem(){

    const keyword =

    document
    .getElementById(
        "search"
    )
    .value
    .toLowerCase();

    const result =

    getStock().filter(x =>

        x.pn
        .toLowerCase()
        .includes(keyword)

        ||

        x.lot
        .toLowerCase()
        .includes(keyword)

    );

    displayData(result);

}

window.onload = function(){

    const user =
    localStorage.getItem(
        "currentUser"
    );

    if(user){

        showMain();

    }

};

</script>

</body>
</html>
