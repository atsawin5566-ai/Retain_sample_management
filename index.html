<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Pro V3.1</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.hdr{background:#fff;padding:12px;border-bottom:3px solid #5b4df5}.wrap{padding:15px}.card{background:#fff;padding:12px;margin:10px 0;border-radius:8px}input,button{padding:8px;margin:4px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#5b4df5;color:#fff}.hidden{display:none}</style></head><body><div class="hdr"><h2>🟣 Solstice Technologies (Thailand) Co., Ltd.</h2><div>Stock Location & Shelf Life Management System V3.1</div></div><div class="wrap"><div id="login"><div class="card"><h3>Login</h3><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><p>admin/admin123 | supervisor/sup123 | user/user123</p></div></div><div id="app" class="hidden"><div class="card"><span id="who"></span> <button onclick="logout()">Logout</button></div><div class="card">Normal:<span id="n">0</span> | Near Expiry:<span id="w">0</span> | Expired:<span id="e">0</span></div><div class="card"><input id="pn" placeholder="PN"><input id="lot" placeholder="Lot"><input id="dt" type="date"><input id="qty" type="number" placeholder="Qty"><input id="loc" placeholder="Location"><button id="saveBtn" onclick="addRow()">บันทึก</button></div><table><thead><tr><th>PN</th><th>Lot</th><th>Qty</th><th>Location</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>const users=[{username:'admin',password:'admin123',role:'Admin'},{username:'supervisor',password:'sup123',role:'Supervisor'},{username:'user',password:'user123',role:'User'}];function getUser(){try{return JSON.parse(localStorage.getItem('user'));}catch(e){return null}}function doLogin(){const username=document.getElementById('u').value.trim();const password=document.getElementById('p').value.trim();const user=users.find(x=>x.username===username&&x.password===password);if(!user){alert('Username หรือ Password ไม่ถูกต้อง');return;}localStorage.setItem('user',JSON.stringify(user));showApp();}function showApp(){const user=getUser();if(!user)return;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').innerText='User: '+user.username+' ('+user.role+')';render();}function logout(){localStorage.removeItem('user');location.reload();}function inv(){return JSON.parse(localStorage.getItem('inventory')||'[]')}function saveInv(d){localStorage.setItem('inventory',JSON.stringify(d));}function addRow(){const d=inv();d.push({pn:pn.value,lot:lot.value,date:dt.value,qty:qty.value,loc:loc.value});saveInv(d);render();}function render(){const d=inv();tb.innerHTML='';d.forEach(r=>tb.innerHTML+=`<tr><td>${r.pn}</td><td>${r.lot}</td><td>${r.qty}</td><td>${r.loc}</td></tr>`);}window.onload=function(){if(getUser())showApp();}</script></body></html>
